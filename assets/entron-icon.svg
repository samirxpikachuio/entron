<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="2.5" />

  <!-- Circuit nodes & traces -->
  <g filter="url(#glow)">
    <!-- Circuit 'E' shape -->
    <path d="M 40 32 L 88 32 A 4 4 0 0 1 92 36 L 92 42 A 4 4 0 0 1 88 46 L 56 46 L 56 58 L 82 58 A 4 4 0 0 1 86 62 L 86 68 A 4 4 0 0 1 82 72 L 56 72 L 56 82 L 88 82 A 4 4 0 0 1 92 86 L 92 92 A 4 4 0 0 1 88 96 L 40 96 A 6 6 0 0 1 34 90 L 34 38 A 6 6 0 0 1 40 32 Z" 
          fill="none" stroke="url(#neonGrad)" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Circuit points -->
    <circle cx="92" cy="39" r="3.5" fill="#00f0ff" />
    <circle cx="86" cy="65" r="3.5" fill="#60a5fa" />
    <circle cx="92" cy="89" r="3.5" fill="#c084fc" />
    <circle cx="40" cy="32" r="3" fill="#00f0ff" />
    <circle cx="40" cy="96" r="3" fill="#a855f7" />

    <!-- Inner circuit line -->
    <path d="M 44 48 L 44 80 M 68 32 L 68 40 M 66 88 L 66 96" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Entron tag -->
  <text x="64" y="112" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="2">ENTRON</text>
</svg>
